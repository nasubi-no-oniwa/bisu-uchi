 if(a&&a.refresh){try{const r=await fetchR('https://securetoken.googleapis.com/v1/token?key='+FB.apiKey,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(a.refresh)});
  if(r.ok){const j=await r.json();a={uid:j.user_id,token:j.id_token,refresh:j.refresh_token,exp:Date.now()+(+j.expires_in)*1000};ls.set('bu_auth',a);return a;}}catch(_){}}
 const r=await fetchR('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key='+FB.apiKey,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({returnSecureToken:true})});
 if(!r.ok)throw new Error('auth');const j=await r.json();a={uid:j.localId,token:j.idToken,refresh:j.refreshToken,exp:Date.now()+(+j.expiresIn)*1000};ls.set('bu_auth',a);return a;}
if(!PV&&!OGP&&!ICON)fbAuth().catch(()=>{});
const DB=p=>FB.databaseURL+'/bisu/'+p;
const QA=a=>'.json?auth='+encodeURIComponent(a.token);const QJ=QA,DBROOT=FB.databaseURL+'/bisu';
const PUT=(url,body)=>fetchR(url,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
// ずる対策：1本目を打った瞬間にサーバーの時計を書く。記録はその時刻から「本数×間隔」の時間が実際にたっていないと載らない
function takeTicket(){if(PV)return Promise.resolve(Date.now());
 const once=async()=>{const a=await fbAuth();const r=await PUT(DB('runs/'+a.uid)+QA(a),{t:{'.sv':'timestamp'}});if(!r.ok)throw new Error('ticket '+r.status);
  const j=await r.json();let st=j&&j.t;if(typeof st!=='number'){const g=await fetchR(DB('runs/'+a.uid+'/t')+QA(a));st=await g.json();}if(typeof st!=='number')throw new Error('ticket t');return st;};
 return (async()=>{const wait=[700,1500,2200,3000,5000];for(let i=0;;i++){try{return await once();}catch(e){console.warn(e);if(i>=wait.length)return null;await new Promise(r=>setTimeout(r,wait[i]));}}})();}
// 1本目を打ったとき。「短すぎる・長すぎる」でやりなおした直後（20秒以内）なら、そのときの時刻を使いまわす
// （前は、2秒以内に打ちなおすとサーバーが新しい時刻をはじいて、その回が記録されなかった）
let lastTicket=null;
function ticketFor(){const now=performance.now();if(lastTicket&&!lastTicket.used&&now-lastTicket.at<20000)return lastTicket.p;lastTicket={p:takeTicket(),at:now,used:false};return lastTicket.p;}
const dayKey=ms=>Math.floor((ms+32400000)/86400000);
const DS=1000000,TOPN=100; // 今日の並び順 ds = 日×1000000＋本数。ランキングは上位100人だけ読む
let sendState={};
async function submit(){const n=G.n,iv=G.iv;const nb=!bestN||n>bestN;if(nb){bestN=n;ls.set('bu_best',bestN);}
 sendState={msg:'',cls:'',canRename:false};const run=G;
 const setMsg=(m,c)=>{sendState.msg=m;sendState.cls=c;if(!$('result').hidden&&resKind==='run'&&G===run){$('sendMsg').textContent=m;$('sendMsg').className='note '+c;}};
 if(PV){setMsg(t('sent2',{d:rankTxt(1),a:rankTxt(1)}),'ok');sendState.canRename=true;return;}
 setMsg(t('sending'),'');
 try{const st=await run.ticket;if(st==null){setMsg(t('offline'),'err');return;}
  const a=await fbAuth();const rec={n:myName(),s:n,st,iv,v:1,t:{'.sv':'timestamp'}};const dk=dayKey(Date.now());const recD={...rec,dk,ds:dk*DS+n};run.sent={rec,recD};
  const cur=await fetchR(DB('all/scores/'+a.uid)+'.json').then(x=>x.ok?x.json():null).catch(()=>null);
  const curD=await fetchR(DB('d/scores/'+a.uid)+'.json').then(x=>x.ok?x.json():null).catch(()=>null);
  const okAll=!cur||cur.s<n,okD=!curD||curD.dk!==dk||curD.s<n;
  if(okD){const res=await PUT(DB('d/scores/'+a.uid)+QA(a),recD);if(res.ok)run.sent.d=1;}
  if(okAll){const res=await PUT(DB('all/scores/'+a.uid)+QA(a),rec);if(res.ok)run.sent.all=1;}
  if(!run.sent.d&&!run.sent.all){setMsg(okAll||okD?t('senderr'):t('notbetter'),okAll||okD?'err':'');return;}
  sendState.canRename=true;const [rd,ra]=await Promise.all([myRank('d',a.uid),myRank('all',a.uid)]);setMsg(t('sent2',{d:rankTxt(rd),a:rankTxt(ra)}),'ok');
  if(!$('result').hidden&&resKind==='run'&&G===run&&!ls.get('bu_name','')){$('rName').hidden=false;$('renameBtn').hidden=false;}
 }catch(e){console.warn(e);setMsg(t('senderr'),'err');}}
$('renameBtn').onclick=async()=>{const nm=$('rName').value.trim(),m=$('sendMsg');const r=G;
 if(!nm){m.textContent=t('needname');m.className='note err';return;}if(badName(nm)){m.textContent=t('badname');m.className='note err';return;}
 ls.set('bu_name',nm);if(!r||!r.sent)return;$('renameBtn').disabled=true;
 try{const a=await fbAuth();if(r.sent.d){const res=await PUT(DB('d/scores/'+a.uid)+QA(a),{...r.sent.recD,n:nm});if(!res.ok)throw 0;}if(r.sent.all){const res=await PUT(DB('all/scores/'+a.uid)+QA(a),{...r.sent.rec,n:nm});if(!res.ok)throw 0;}
  m.textContent=t('renamed');m.className='note ok';$('rName').hidden=true;$('renameBtn').hidden=true;}catch(e){m.textContent=t('senderr');m.className='note err';}
 $('renameBtn').disabled=false;};
let rulerN=0;
async function cntNum(X,daily){try{if(daily){const r=await fetchR(DB(X+'t')+'.json');if(!r.ok)return 0;const j=await r.json();return j&&j.dk===dayKey(Date.now())?(+j.n||0):0;}const r=await fetchR(DB(X+'c')+'.json');if(!r.ok)return 0;const j=await r.json();return +j||0;}catch(e){return 0;}}
async function cntPut(X,a,rec){let ok=false;try{const [c,z]=await Promise.all([fetchR(DB(X+'/'+a.uid)+'.json').then(r=>r.ok?r.json():null),fetchR(DB(X+'t')+'.json').then(r=>r.ok?r.json():null)]);const today=dayKey(Date.now()),d0=today*86400000-32400000;const body={};body[X+'/'+a.uid]=rec;if(!c)body[X+'c']={'.sv':{increment:1}};if(!c||!(c.t>=d0)){if(z&&z.dk===today)body[X+'t/n']={'.sv':{increment:1}};else body[X+'t']={dk:today,n:1};}const r=await fetchR(DBROOT+QJ(a),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});ok=r.ok;}catch(_){}if(!ok){const r=await fetchR(DB(X+'/'+a.uid)+QJ(a),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(rec)});if(!r.ok)throw new Error('put '+r.status);}}
async function countOf(p,since){const url=since?DB(p)+'.json?orderBy=%22t%22&startAt='+since:DB(p)+'.json?shallow=true';const r=await fetchR(url);if(!r.ok)return 0;const j=await r.json();return j?Object.keys(j).length:0;}
async function sendRuler(){if(PV){rulerN=3;return;}try{const a=await fbAuth();await cntPut('ruler',a,{t:{'.sv':'timestamp'}});rulerN=await cntNum('ruler',false);if(mode==='result'&&resKind==='ruler')$('sendMsg').textContent=t('rulerCount',{n:rulerN.toLocaleString()});}catch(e){console.warn(e);}}
async function loadBoard(board){const today=dayKey(Date.now());
 const url=board==='d'?DB('d/scores')+'.json?orderBy=%22ds%22&startAt='+(today*DS)+'&endAt='+(today*DS+DS-1)+'&limitToLast='+TOPN:DB('all/scores')+'.json?orderBy=%22s%22&limitToLast='+TOPN;
 const [d,h]=await Promise.all([fetch(url).then(r=>{if(!r.ok)throw 0;return r.json()}),fetch(DB('hidden')+'.json').then(r=>r.ok?r.json():null).catch(()=>null)]);
 return Object.entries(d||{}).map(([id,v])=>({...v,id})).filter(r=>!(h&&h[r.id])&&typeof r.s==='number').sort((a,b)=>b.s-a.s||a.t-b.t);}
const rankTxt=r=>r?t('rankN',{r}):t('rankOut');
async function myRank(board,uid){try{const rows=await loadBoard(board);const i=rows.findIndex(r=>r.id===uid);return i>=0?i+1:null;}catch(e){return null;}}
let rankFrom=false;
const rowH=(r,i,me)=>'<tr'+(me?' class="me"':'')+'><td class="r">'+(i+1)+'</td><td class="n">'+esc(r.n)+'<br><small style="color:var(--sub);font-size:11px">'+esc(grade(r.s))+(typeof r.iv==='number'?' ・ '+esc(t('ivLine',{s:fs2(r.iv)})):'')+'</small></td><td class="c">'+r.s+esc(t('hon'))+'</td></tr>';
const rulerRowH=n=>'<tr class="ruler"><td class="r">'+esc(t('rulerMark'))+'</td><td class="n">'+esc(t('rulerRow'))+'</td><td class="c">'+esc(t('people',{n:n.toLocaleString()}))+'</td></tr>';
async function openRank(board,fromResult){rankFrom=!!fromResult;show('rankPanel');$('tabDay').classList.toggle('on',board==='d');$('tabAll').classList.toggle('on',board==='all');$('tabDay').onclick=()=>openRank('d',rankFrom);$('tabAll').onclick=()=>openRank('all',rankFrom);
 const box=$('rankBox');box.innerHTML='<p>'+t('loading')+'</p>';
 if(PV){box.innerHTML='<table class="rank">'+rulerRowH(3)+rowH({n:myName(),s:bestN||12,iv:620},0,true)+'</table>';return;}
 try{const since=board==='d'?(dayKey(Date.now())*86400000-32400000):0;
  const [rows,qn]=await Promise.all([loadBoard(board),cntNum('ruler',board==='d')]);const myId=(ls.get('bu_auth',null)||{}).uid;
  let h='<table class="rank">'+rulerRowH(qn);h+=rows.slice(0,TOPN).map((r,i)=>rowH(r,i,r.id===myId)).join('');
  if(!rows.length)h+='<tr><td></td><td colspan="2">'+t('empty')+'</td></tr>';box.innerHTML=h+'</table>';
 }catch(e){box.innerHTML='<p>'+t('rankerr')+'</p>';}}
$('rankBtn').onclick=()=>openRank('d');$('rRank').onclick=()=>openRank('d',true);
$('rankBack').onclick=()=>{if(rankFrom){show('result');}else showTitle();};

// ===== まわす =====
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;mT+=dt;
 if(mode==='title'){const a=now/1000*.15;camPT.set(cx+Math.sin(a)*3.2,1.9,Math.cos(a)*3.2+.4);camLT.set(cx,1.05,-.2);camK=1.5;}
 else if(mode==='wait'||mode==='base'||mode==='play'){camFollow(G.iv>1500?.4:0);camK=7;if(mode==='play')playUpdate(now);else if(mode==='base')baseUpdate(now);}
 else if(mode==='fail'){const fx=G.fx==null?G.lastX:G.fx;camPT.set(fx-.35,1.12,portrait?1.15:.9);camLT.set(fx-.12,PT+.03,0);camK=3;failUpdate();}
 else if(mode==='ruler'){camFollow(.8);camK=2.5;rulerUpdate();}
 else if(mode==='result'){const a=Math.sin(now/1000*.25)*.6;camPT.set(cx+Math.sin(a)*3.2,1.9,Math.cos(a)*3.2+.3);camLT.set(cx-.3,1.0,-.1);camK=1.2;}
 pose(dt);stepScrews(dt);camStep(dt);R.render(SC,CAM);}

// ===== はじめ =====
function ogpScene(sq){for(let i=-9;i<=0;i++){const s=newScrew(i*S+.02,false);s.a=1;s.g.position.y=PT-.067*SK;}
 const bx=.02+S;const b=newScrew(bx,true);b.a=.999;toolX=toolXT=cx=cxT=bx+S;lift=liftT=.08;
 for(let i=0;i<30;i++){pose(.05);stepScrews(.05);}
 if(sq){camP.set(bx+.05,1.32,.95);camL.set(bx+.3,PT+.13,0);}else{camP.set(bx+1.1,1.8,2.4);camL.set(bx-.55,1.08,-.15);}
 CAM.position.copy(camP);CAM.lookAt(camL);R.render(SC,CAM);}
if(OGP){document.body.style.width='1200px';document.body.style.height='630px';R.setPixelRatio(1);R.setSize(1200,630,false);CAM.aspect=1200/630;CAM.fov=40;CAM.updateProjectionMatrix();
 $('ogpT').hidden=false;$('ogpT').innerHTML='<b>'+esc(t('ogp1'))+'</b><i>'+esc(t('ogp2'))+'</i><s>'+esc(t('ogp3'))+'</s>';ogpScene(false);window.__ready=1;}
else if(ICON){R.setPixelRatio(1);R.setSize(512,512,false);CAM.aspect=1;CAM.fov=40;CAM.updateProjectionMatrix();ogpScene(true);window.__ready=1;}
else{showTitle();requestAnimationFrame(loop);}
window.__BU={get mode(){return mode},get G(){return G},hit,startRuler};
</script>
